<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ef6c00">
<meta name="description" content="One-page milk indent calculator for Heritage, Vijaya, Amul and Jersey.">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/milk-app.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/milk-app.svg">
<title>Milk Indent Calculator</title>
<style>
:root{--orange:#ef6c00;--pale:#fff0e0;--ink:#2b2118;--muted:#76685d;--line:#f0d9c5;--bg:#fff8f2;--white:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
header{background:var(--orange);color:#fff;padding:20px 16px}
header .wrap,main{max-width:1100px;margin:auto}
h1{font-size:clamp(1.45rem,4vw,2rem);margin:0}
header p{margin:4px 0 0;opacity:.94}
main{padding:16px 14px 30px}
.brand-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.brand{background:#fff;border:1px solid var(--line);border-radius:15px;overflow:hidden;box-shadow:0 3px 14px #6b3b1710}
.brand-head{display:flex;align-items:center;gap:12px;background:var(--pale);padding:10px 12px;min-height:76px}
.brand-head img{width:76px;height:54px;object-fit:contain;background:#fff;border-radius:9px;padding:3px}
.brand-head h2{margin:0;color:var(--orange);font-size:1.15rem}
.brand-body{padding:10px 12px}
.column-head,.milk-row{display:grid;grid-template-columns:minmax(82px,1.05fr) repeat(3,minmax(68px,.85fr));gap:7px;align-items:center}
.column-head{font-size:.75rem;color:var(--muted);font-weight:700;padding:0 0 7px}
.milk-row{padding:7px 0;border-top:1px solid #f8e9dc}
.milk-name{display:flex;align-items:center;gap:6px;font-weight:700;font-size:.9rem}.milk-name img{width:48px;height:42px;object-fit:contain;border-radius:6px;background:#fff}
.milk-row input{width:100%;min-width:0;padding:9px 5px;border:1px solid #e7c9ae;border-radius:8px;font:inherit;text-align:center;background:#fff}
.milk-row input:focus{outline:2px solid #ffbd80;border-color:var(--orange)}
.brand-total{display:flex;justify-content:space-between;gap:8px;margin-top:10px;padding:10px;background:#fff8f2;border:1px solid var(--line);border-radius:9px;font-weight:700}
.brand-total span:last-child{color:var(--orange);text-align:right}
.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}
.metric{background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px}
.metric span{display:block;color:var(--muted);font-size:.85rem}
.metric strong{display:block;margin-top:5px;font-size:clamp(1.1rem,3vw,1.5rem);color:var(--orange);overflow-wrap:anywhere}
.note{text-align:center;color:var(--muted);font-size:.82rem;margin:14px 0 0}
@media(max-width:680px){.brand-grid{grid-template-columns:1fr}.summary{grid-template-columns:1fr}.brand-head img{width:84px}}
@media(max-width:360px){.column-head,.milk-row{grid-template-columns:minmax(70px,1fr) repeat(3,minmax(55px,.8fr));gap:4px}.milk-row input{padding:8px 2px;font-size:.9rem}.brand-body{padding:9px}}
</style>
</head>
<body>
<header><div class="wrap"><h1>Milk Indent Calculator</h1><p>Enter price per litre, quantity taken and returned for each milk type.</p></div></header>
<main>
  <section class="brand-grid" id="brandGrid" aria-label="Milk brand cards"></section>
  <section class="summary" aria-label="Bill summary">
    <div class="metric"><span>Total Amount</span><strong id="totalAmount">₹0.00</strong></div>
    <div class="metric"><span>Commission (Total Quantity × ₹5)</span><strong id="commission">₹0.00</strong></div>
    <div class="metric"><span>Amount After Commission</span><strong id="afterCommission">₹0.00</strong></div>
  </section>
  <p class="note">Net quantity = Taken − Return. Commission is ₹5 per net litre. Your entries are saved on this device.</p>
</main>
<script>
(() => {
  const brands = [
    {name:"Heritage",image:"./product-images/heritage-products.webp",types:["TM","CM","SM","WM","Small"],prices:{TM:66,CM:66,SM:68,WM:90,Small:45}},
    {name:"Vijaya",image:"./product-images/vijaya-products.webp",types:["TM","CM","SM","WM"],prices:{TM:64,CM:64,SM:70,WM:80}},
    {name:"Amul",image:"./product-images/amul-products.webp",types:["TM","A2","Gold"],prices:{TM:62,A2:90,Gold:78}},
    {name:"Jersey",image:"./product-images/jersey-products.webp",types:["TM","WM"],prices:{TM:66,WM:90}}
  ];
  const storageKey="milkIndentCalculator.v2";
  let values={};
  try{values=JSON.parse(localStorage.getItem(storageKey)||"{}")||{};}catch(e){values={};}
  const money=n=>"₹"+n.toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
  const number=v=>Math.max(0,Number(v)||0);
  const key=(brand,type)=>brand+"|"+type;
  const get=(brand,type)=>values[key(brand,type)]||{price:String(brands.find(b=>b.name===brand)?.prices?.[type]??""),taken:"",returned:""};
  function save(){try{localStorage.setItem(storageKey,JSON.stringify(values));}catch(e){}}
  function calculate(){
    let totalAmount=0,totalQuantity=0;
    brands.forEach(brand=>{
      let brandQuantity=0,brandAmount=0;
      brand.types.forEach(type=>{
        const d=get(brand.name,type);
        const net=Math.max(0,number(d.taken)-number(d.returned));
        const amount=net*number(d.price);
        brandQuantity+=net;brandAmount+=amount;
        totalQuantity+=net;totalAmount+=amount;
      });
      const q=document.querySelector('[data-brand-qty="'+brand.name+'"]');
      const a=document.querySelector('[data-brand-amount="'+brand.name+'"]');
      if(q)q.textContent=brandQuantity.toLocaleString("en-IN",{maximumFractionDigits:2})+" L";
      if(a)a.textContent=money(brandAmount);
    });
    const commission=totalQuantity*5;
    document.getElementById("totalAmount").textContent=money(totalAmount);
    document.getElementById("commission").textContent=money(commission);
    document.getElementById("afterCommission").textContent=money(totalAmount-commission);
  }
  function render(){
    const grid=document.getElementById("brandGrid");
    brands.forEach(brand=>{
      const card=document.createElement("article");card.className="brand";
      const head=document.createElement("div");head.className="brand-head";
      const img=document.createElement("img");img.src=brand.image;img.alt=brand.name+" milk products";
      const title=document.createElement("h2");title.textContent=brand.name;
      head.append(img,title);card.append(head);
      const body=document.createElement("div");body.className="brand-body";
      const headings=document.createElement("div");headings.className="column-head";
      ["Milk Type","Price/Litre","Taken","Return"].forEach(label=>{const s=document.createElement("span");s.textContent=label;headings.append(s);});
      body.append(headings);
      brand.types.forEach(type=>{
        const d=get(brand.name,type);
        const row=document.createElement("div");row.className="milk-row";
        const name=document.createElement("div");name.className="milk-name";const productImg=document.createElement("img");productImg.src=brand.image;productImg.alt=brand.name+" "+type+" milk";const label=document.createElement("span");label.textContent=type;name.append(productImg,label);row.append(name);
        [["price","Price per litre","0.00"],["taken","Taken in litres","0"],["returned","Returned in litres","0"]].forEach(([field,label,placeholder])=>{
          const input=document.createElement("input");input.type="number";input.min="0";input.step="0.01";input.inputMode="decimal";input.placeholder=placeholder;input.value=d[field]||"";input.setAttribute("aria-label",brand.name+" "+type+" "+label);
          input.addEventListener("input",()=>{if(!values[key(brand.name,type)])values[key(brand.name,type)]={price:"",taken:"",returned:""};values[key(brand.name,type)][field]=input.value;save();calculate();});
          row.append(input);
        });
        body.append(row);
      });
      const total=document.createElement("div");total.className="brand-total";
      const qty=document.createElement("span");qty.textContent="Total Litres: ";const qtyValue=document.createElement("span");qtyValue.dataset.brandQty=brand.name;qtyValue.textContent="0 L";qty.append(qtyValue);
      const amount=document.createElement("span");amount.textContent="Total Price: ";const amountValue=document.createElement("span");amountValue.dataset.brandAmount=brand.name;amountValue.textContent="₹0.00";amount.append(amountValue);
      total.append(qty,amount);body.append(total);card.append(body);grid.append(card);
    });
    calculate();
  }
  render();
})();
</script>
<script>
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js").catch(err=>console.warn("Service worker registration failed",err)));}
</script>
</body>
</html>
